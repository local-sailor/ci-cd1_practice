

name: CI
on: [push, pull_request]
jobs:
    hello:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4  #note that spaces after dashes - matter
        - uses: actions/setup-python@v5 #also spaes after each colon :
          with: 
            python-version: "3.12"
        - run: pip install pytest ruff
        - run: ruff check .   # lint first: fast, catches typos and style issues before tests run
        - run: python src/helloworld.py
        - run: pytest -v   # -v makes the test log more descriptive usually it's . for a pass and F for fail


